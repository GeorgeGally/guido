<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ruler icon sizes</title>
  <style>
    *{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;place-items:center;background:#ececec;color:#666;font:14px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace}.samples{display:flex;align-items:center;gap:44px;padding:32px 42px;background:#f7f6f1}.sample{display:flex;align-items:center;gap:14px}.sample img{display:block}.sample span{font-size:13px}
  </style>
</head>
<body>
  <main class="samples"><div class="sample"><img src="../icons/ruler-128.png" width="128" height="128" alt="Ruler icon at 128 pixels"><span>128 px</span></div><div class="sample"><img src="../icons/ruler-16.png" width="16" height="16" alt="Ruler icon at 16 pixels"><span>16 px</span></div></main>
</body>
</html>
